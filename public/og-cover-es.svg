<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DtMF La Casita Lyric Challenge</title>
  <desc id="desc">A social preview cover for the DtMF La Casita lyric guessing game.</desc>
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#2c2410"/>
      <stop offset="52%" stop-color="#080706"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a2b12" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b0a08" stop-opacity="0.96"/>
